<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ flight_num }} · {{ couple }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Lato:wght@300;400;700&family=Great+Vibes&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- Barre supérieure -->
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="plane-icon">✈</span>
      <span>{{ flight_num }}</span>
      <span class="top-bar-sep">·</span>
      <span>DESTINATION · NOTRE PLUS BELLE AVENTURE</span>
      <span class="top-bar-sep">·</span>
      <button id="music-btn" onclick="toggleMusic()" style="background:none;border:none;cursor:pointer;color:inherit;font-size:.85rem;letter-spacing:.05em;font-family:var(--mono);padding:0">
        🎵 Musique
      </button>
    </div>
    <div class="top-bar-right">
      <span id="tb-clock"></span>
    </div>
  </div>

  <audio id="bg-music" loop>
    <source src="/static/conjugal-visit.mp3" type="audio/mpeg" />
  </audio>

  {% block content %}{% endblock %}

  <footer>
    <span>✈ {{ couple }}</span>
    &nbsp;·&nbsp; {{ date }}
    &nbsp;·&nbsp; {{ place }}
  </footer>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      const s = String(now.getSeconds()).padStart(2,'0');
      const el = document.getElementById('tb-clock');
      if (el) el.textContent = h + ':' + m + ':' + s;
    }
    updateClock();
    setInterval(updateClock, 1000);

    const music = document.getElementById('bg-music');
    const btn   = document.getElementById('music-btn');
    let playing  = false;

    function toggleMusic() {
      if (playing) {
        music.pause();
        btn.textContent = '🎵 Musique';
      } else {
        music.play();
        btn.textContent = '⏸ Pause';
      }
      playing = !playing;
    }
  </script>

</body>
</html>
